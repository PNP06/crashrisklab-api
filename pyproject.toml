[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E","F","I","UP","B","C4","SIM","N","ANN"]
ignore = ["ANN101","ANN102"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
show_error_codes = true
exclude = ["tests/", "build/", "dist/", "__pycache__/", "frontend/"]

