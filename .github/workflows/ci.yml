name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        working-directory: crashrisklab-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pre-commit
      - name: Lint & type-check
        working-directory: crashrisklab-api
        run: |
          pre-commit run --all-files || true
      - name: Tests
        working-directory: crashrisklab-api
        run: pytest -q
      - name: Docker build
        working-directory: crashrisklab-api
        run: docker build -t crashrisklab-api:ci .
