name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r crashrisklab-api/requirements.txt
          pip install pre-commit
      - name: Lint & type-check
        run: |
          (cd crashrisklab-api && pre-commit run --all-files || true)
      - name: Tests
        run: |
          cd crashrisklab-api
          pytest -q
      - name: Docker build
        run: docker build -t crashrisklab-api:ci ./crashrisklab-api
